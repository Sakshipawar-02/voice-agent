<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Agent Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 28px 16px; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    main { width: min(100%, 900px); margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; }
    h1 { margin: 0; color: #38bdf8; font-size: 1.7rem; }
    a, button { color: #7dd3fc; font: inherit; }
    button { padding: 9px 14px; border: 0; border-radius: 8px; background: #2563eb; color: white; font-weight: 700; cursor: pointer; }
    #message { color: #cbd5e1; }
    #items { display: grid; gap: 14px; }
    article { padding: 16px; border: 1px solid #334155; border-radius: 10px; background: #1e293b; }
    article p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
    article p + p { margin-top: 12px; }
    .label { display: block; margin-bottom: 4px; color: #7dd3fc; font-size: .78rem; font-weight: 700; text-transform: uppercase; }
    time { display: block; margin-top: 12px; color: #94a3b8; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Voice Agent Dashboard</h1>
      <nav><a href="/">Back to voice agent</a> &nbsp; <button id="refresh" type="button">Refresh</button></nav>
    </header>
    <p id="message" role="status">Loading conversations…</p>
    <section id="items" aria-live="polite"></section>
  </main>
  <script src="dashboard.js?v=1"></script>
</body>
</html>
