<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Agent</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 28px 16px; display: grid; place-items: center; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    main { width: min(100%, 760px); }
    h1 { margin: 0 0 6px; color: #38bdf8; font-size: 1.7rem; }
    .card { padding: 22px; border: 1px solid #334155; border-radius: 14px; background: #1e293b; box-shadow: 0 12px 32px #0003; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .dashboard-link { color: #7dd3fc; font-weight: 600; }
    #statusBadge { color: #94a3b8; font-size: .92rem; }
    #statusBadge.active { color: #4ade80; }
    #statusBadge.error { color: #fca5a5; }
    button { min-width: 180px; padding: 12px 18px; border: 0; border-radius: 9px; background: #2563eb; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button.active { background: #dc2626; }
    button:disabled { opacity: .65; cursor: wait; }
    #transcriptBox { display: grid; gap: 14px; max-height: 60vh; overflow-y: auto; }
    .turn { padding: 14px; border: 1px solid #334155; border-radius: 10px; background: #0f172a; }
    .turn p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
    .turn p + p { margin-top: 12px; }
    .label { display: block; margin-bottom: 4px; color: #7dd3fc; font-size: .78rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    @media (max-width: 520px) { .card { padding: 16px; } .toolbar { align-items: stretch; flex-direction: column; } button { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <h1>Voice Agent</h1>
    <section class="card" aria-label="Voice conversation">
      <div class="toolbar">
        <a class="dashboard-link" href="/dashboard.html">Dashboard</a>
        <button id="toggleAgentBtn" type="button">Start voice agent</button>
      </div>
      <div id="transcriptBox" aria-live="polite"></div>
    </section>
  </main>
  <script src="app.js?v=hands-free-3"></script>
</body>
</html>
