<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Agent</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 450px;
      width: 100%;
    }
    h1 {
      margin-bottom: 0.5rem;
      font-size: 1.75rem;
      color: #38bdf8;
    }
    p.subtitle {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    .status-badge {
      display: inline-block;
      padding: 0.35rem 1rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1.75rem;
      background: #334155;
      color: #94a3b8;
      transition: all 0.3s ease;
    }
    .status-badge.active {
      background: #166534;
      color: #4ade80;
    }
    .status-badge.error {
      background: #991b1b;
      color: #fca5a5;
    }
    .btn-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    button {
      flex: 1;
      padding: 0.85rem 1.25rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    #startBtn {
      background: #2563eb;
      color: #ffffff;
    }
    #startBtn:hover:not(:disabled) {
      background: #1d4ed8;
    }
    #stopBtn {
      background: #dc2626;
      color: #ffffff;
    }
    #stopBtn:hover:not(:disabled) {
      background: #b91c1c;
    }
    button:disabled {
      background: #475569 !important;
      cursor: not-allowed;
      opacity: 0.5;
    }
    .transcript-box {
      background: #0f172a;
      padding: 1rem;
      border-radius: 0.5rem;
      text-align: left;
      min-height: 100px;
      max-height: 180px;
      overflow-y: auto;
      font-size: 0.875rem;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Voice Agent</h1>
    <p class="subtitle">Real-time Bidirectional AI Speech Interaction</p>

    <div id="statusBadge" class="status-badge">Disconnected</div>

    <div class="btn-group">
      <button id="startBtn">Start Call</button>
      <button id="stopBtn" disabled>End Call</button>
    </div>

    <div id="transcriptBox" class="transcript-box">
      <em>Transcripts and system status will appear here...</em>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
